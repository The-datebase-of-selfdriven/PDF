<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本史総合クイズ｜統合・不具合修正版</title>
<style>
*{box-sizing:border-box}body{font-family:sans-serif;max-width:760px;margin:10px auto;padding:0 12px;line-height:1.55}
button{display:block;width:100%;margin:6px 0;padding:9px;font-size:1rem;text-align:left;cursor:pointer}
#startBtn{text-align:center;font-weight:bold}.hidden{display:none!important}
fieldset{margin:10px 0;padding:10px;border:1px solid #bbb;border-radius:8px}.mode-grid,.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
.answer,.stem{margin:10px 0;padding:10px;border:1px solid #ccc;background:#fafafa;border-radius:6px}.bad{background:#fff0f0;border-color:#d99}.good{background:#f0fff0;border-color:#9c9}
@media(max-width:560px){.mode-grid,.check-grid{grid-template-columns:1fr}}
.stats-actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.stats-actions button{width:auto;flex:1 1 auto;min-width:120px}
#statsList table,#statsSummary table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:6px}
#statsList th,#statsList td,#statsSummary th,#statsSummary td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}
#statsList{max-height:60vh;overflow:auto;border:1px solid #ddd;border-radius:6px}
.ok{color:#2a2}.ng{color:#d33}
</style>
</head>
<body>
<h1>日本史総合クイズ</h1>
<div id="settings">
<fieldset><legend>出題分野</legend>
<label><input type="radio" name="section" value="culture" checked onchange="updateSection()"> 文化史</label>
<label><input type="radio" name="section" value="chronology" onchange="updateSection()"> 年代史</label>
</fieldset>
<fieldset id="cultureSettings"><legend>文化史の時代・文化（複数選択可）</legend><div id="cultureList" class="check-grid"></div></fieldset>
<fieldset id="chronologySettings" class="hidden"><legend>年代史の時代（複数選択可）</legend>
<div class="check-grid">
<label><input type="checkbox" class="chrono-era" value="ancient" checked> 古代（旧石器・縄文・弥生・古墳・飛鳥・奈良・平安）</label>
<label><input type="checkbox" class="chrono-era" value="medieval" checked> 中世（鎌倉・室町・戦国）</label>
<label><input type="checkbox" class="chrono-era" value="earlymodern" checked> 近世（安土桃山・江戸）</label>
<label><input type="checkbox" class="chrono-era" value="modern1" checked> 近代Ⅰ（明治・大正）</label>
<label><input type="checkbox" class="chrono-era" value="modern2" checked> 近代Ⅱ・現代（昭和・平成・令和）</label>
</div></fieldset>
<fieldset><legend>難易度</legend>
<label><input type="radio" name="difficulty" value="easy" checked> かんたん</label><br>
<label><input type="radio" name="difficulty" value="hard"> むずかしい（近い時代・年号を優先）</label></fieldset>
<fieldset><legend>モード</legend>
<div id="cultureModes" class="mode-grid">
<label><input type="radio" name="cultureMode" value="c1" checked> 時代 → 文化の特色</label>
<label><input type="radio" name="cultureMode" value="c2"> 時代 → 文化のもの</label>
<label><input type="radio" name="cultureMode" value="r1"> 文化の特色 → 時代・文化</label>
<label><input type="radio" name="cultureMode" value="r2"> 文化のもの → 時代・文化</label>
<label><input type="radio" name="cultureMode" value="b1"> 2つの出来事の間 → 文化の特色</label>
<label><input type="radio" name="cultureMode" value="b2"> 2つの出来事の間 → 文化のもの</label>
<label><input type="radio" name="cultureMode" value="s1"> 文化の特色の並び替え</label>
<label><input type="radio" name="cultureMode" value="s2"> 文化のものの並び替え</label>
</div>
<div id="chronologyModes" class="mode-grid hidden">
<label><input type="radio" name="chronoMode" value="choice" checked> 年号選択</label>
<label><input type="radio" name="chronoMode" value="sort4"> 並び替え（4つ）</label>
<label><input type="radio" name="chronoMode" value="sort6"> 並び替え（6つ）</label>
<label><input type="radio" name="chronoMode" value="between"> 間の出来事</label>
</div></fieldset>
<button id="startBtn" onclick="startQuiz()">開始（10問セット）</button>
<button id="statsBtn" onclick="openStats()">📊 実績を見る</button>
</div>
<div id="quiz" class="hidden"><p id="progress"></p><div id="question"></div><div id="feedback"></div></div>
<div id="stats" class="hidden">
<h2>学習実績</h2>
<div id="statsSummary"></div>
<div class="stats-actions">
<button onclick="exportHistory()">JSONで書き出し</button>
<button onclick="document.getElementById('importFile').click()">JSONを読み込む</button>
<input type="file" id="importFile" accept="application/json" class="hidden" onchange="importHistory(event)">
<button onclick="clearHistory()">履歴を削除</button>
<button onclick="closeStats()">設定に戻る</button>
</div>
<h3>回答履歴（新しい順）</h3>
<div id="statsList"></div>
</div>

function questionLabel(q){
 if(q.section==="culture"){

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniq(a){const seen=new Set(),out=[];for(const v of (a||[])){const k=typeof v+"\0"+String(v);if(!seen.has(k)){seen.add(k);out.push(v)}}return out}

function cultureLabel(c){return c.era+"・"+c.name}

function itemDisplay(i){return i[1]?i[0]+"（"+i[1]+"）":i[0]}
function similarity(a,b){let A=new Set((a.trait+a.name).split("")),B=new Set((b.trait+b.name).split("")),n=0;for(const x of A)if(B.has(x))n++;return n}
function similarityText(a,b){let n=0;for(const x of a)if(b.includes(x))n++;return n}
function cultureOptions(c,p){
  let o=p.filter(x=>x!==c);
  if(o.length<3)return [];
  if(difficulty==="hard")o.sort((a,b)=>similarity(b,c)-similarity(a,c));
  else o=shuffle(o);
  return shuffle([c,...o.slice(0,3)]);
}
function eraOptions(c,p){
  let o=p.filter(x=>x!==c);
  if(o.length<3)return [];
  if(difficulty==="hard")o.sort((a,b)=>similarity(b,c)-similarity(a,c));
  else o=shuffle(o);
  return shuffle([cultureLabel(c),...o.slice(0,3).map(cultureLabel)]);
}
function uniqueItems(c){let m=new Map;for(const x of DATA.cultures)for(const i of x.items)m.set(i[0],(m.get(i[0])||0)+1);return c.items.filter(i=>m.get(i[0])===1)}
function itemOptions(name,c,p){
  const good=c.items.find(i=>i[0]===name);
  if(!good)return[];
  const targetName=good[0];
  const candidates=[];
  for(const x of p){
    if(x===c)continue;
    for(const i of x.items){
      if(i[0]===targetName)continue;
      if(!candidates.some(v=>v[0]===i[0]))candidates.push(i);
    }
  }
  let o=difficulty==="hard"
    ?candidates.sort((a,b)=>similarityText(b[0],targetName)-similarityText(a[0],targetName))
    :shuffle(candidates);
  if(o.length<3)return[];
  return shuffle([itemDisplay(good),...o.slice(0,3).map(itemDisplay)]);
}

  for(let i=0;i<ev.length-1;i++){
    for(let j=i+1;j<ev.length;j++){
      const low=ev[i],high=ev[j];
      if(high.year-low.year<40)continue;
      const active=valid.filter(c=>CULTURE_REP_YEAR[c.name]>low.year&&CULTURE_REP_YEAR[c.name]<high.year);
      if(active.length!==1)continue;
      candidates.push({low,high,c:active[0],span:high.year-low.year});
    }
  }
  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.span-b.span);
  const pool=difficulty==="hard"?candidates.slice(0,Math.min(30,candidates.length)):candidates.slice(0,Math.min(80,candidates.length));
  return pool[Math.floor(Math.random()*pool.length)];
}
function makeCultureQuestion(){
  let c,good,base,entries,answer;
  if(!selectedCultures.length)return null;
  if(cultureMode==="c1"){
    c=selectedCultures[Math.floor(Math.random()*selectedCultures.length)];
    const opts=cultureOptions(c,selectedCultures);
    if(opts.length!==4)return null;
    return{type:"choice",section:"culture",prompt:`${cultureQuestionName(c)}の特色として最も適切なものを選びなさい。`,answer:c.trait,options:opts.map(x=>x.trait),culture:c};
  }
  if(cultureMode==="c2"){
    c=selectedCultures[Math.floor(Math.random()*selectedCultures.length)];
    base=uniqueItems(c); good=(base.length?base:c.items)[Math.floor(Math.random()*(base.length?base.length:c.items.length))];
    const opts=itemOptions(good[0],c,selectedCultures);
    if(opts.length!==4)return null;
    return{type:"choice",section:"culture",prompt:`${cultureQuestionName(c)}と最も関係の深いものを選びなさい。`,answer:itemDisplay(good),options:opts,culture:c};
  }
  if(cultureMode==="r1"){
    c=selectedCultures[Math.floor(Math.random()*selectedCultures.length)];
    const opts=eraOptions(c,selectedCultures);if(opts.length!==4)return null;
    return{type:"choice",section:"culture",prompt:"次の文化の特色と最も関係の深い時代・文化を選びなさい。",stem:c.trait,answer:cultureLabel(c),options:opts,culture:c};
  }
  if(cultureMode==="r2"){
    c=selectedCultures[Math.floor(Math.random()*selectedCultures.length)];
    base=uniqueItems(c);good=(base.length?base:c.items)[Math.floor(Math.random()*(base.length?base.length:c.items.length))];
    const opts=eraOptions(c,selectedCultures);if(opts.length!==4)return null;
    return{type:"choice",section:"culture",prompt:`「${itemDisplay(good)}」と最も関係の深い時代・文化を選びなさい。`,answer:cultureLabel(c),options:opts,culture:c};
  }
  if(cultureMode==="b1"||cultureMode==="b2"){
    const pair=cultureBetween();if(!pair)return null;c=pair.c;
    if(cultureMode==="b1"){
      const opts=cultureOptions(c,selectedCultures);if(opts.length!==4)return null;
      return{type:"choice",section:"culture",stem:`「${pair.low.name}（${pair.low.yearText}）」→「${pair.high.name}（${pair.high.yearText}）」`,prompt:"この2つの出来事の間に主に栄えた文化として、最も適切なものを選びなさい。",answer:c.trait,options:opts.map(x=>x.trait),culture:c,betweenPair:pair};
    }
    base=uniqueItems(c);good=(base.length?base:c.items)[Math.floor(Math.random()*(base.length?base.length:c.items.length))];
    const opts=itemOptions(good[0],c,selectedCultures);if(opts.length!==4)return null;
    return{type:"choice",section:"culture",stem:`「${pair.low.name}（${pair.low.yearText}）」→「${pair.high.name}（${pair.high.yearText}）」`,prompt:"この2つの出来事の間に主に栄えた文化に関係するものとして、最も適切なものを選びなさい。",answer:itemDisplay(good),options:opts,culture:c,betweenPair:pair};
  }
  c=selectedCultures[Math.floor(Math.random()*selectedCultures.length)];
  if(cultureMode==="s1"){
    if(selectedCultures.length<4)return null;
    const b=shuffle(selectedCultures).slice(0,4),labs=["ア","イ","ウ","エ"];
    const cor=[...b].sort((a,x)=>(CULTURE_ORDER[a.name]||99)-(CULTURE_ORDER[x.name]||99));
    answer=cor.map(x=>labs[b.indexOf(x)]).join("→");
    const all=perms(4).map(x=>x.split(",").map(i=>labs[+i]).join("→"));
    const wrong=shuffle(all.filter(x=>x!==answer)).slice(0,5);
    return{type:"sort",section:"culture",prompt:"次の文化を、主に栄えた時期の古い順に並べ替えなさい。",cultures:b,entries:b.map((x,i)=>({label:labs[i],text:x.trait})),answer,shown:shuffle([answer,...wrong])};
  }
  const itemCultures=selectedCultures.filter(x=>uniqueItems(x).length>=4);
  if(!itemCultures.length)return null;
  c=itemCultures[Math.floor(Math.random()*itemCultures.length)];
  const source=uniqueItems(c),chosen=shuffle(source).slice(0,4),labs=["ア","イ","ウ","エ"];
  const sortAnswer=source.filter(x=>chosen.some(e=>e[0]===x[0])).map(x=>labs[chosen.findIndex(e=>e[0]===x[0])]).join("→");
  const all=perms(4).map(x=>x.split(",").map(i=>labs[+i]).join("→")),wrong=shuffle(all.filter(x=>x!==sortAnswer)).slice(0,5);
  return{type:"sort",section:"culture",prompt:`${c.name}に関係する文化のものを、資料に示された順に並べ替えなさい。`,culture:c,entries:chosen.map((x,i)=>({label:labs[i],text:x[0]})),answer:sortAnswer,shown:shuffle([sortAnswer,...wrong])};
}

function chronoEra(i){return({1:"ancient",2:"medieval",3:"earlymodern",4:"modern1",5:"modern2"})[i.p]}
function chronoPool(){return pdfDatabase.filter(i=>selectedChronoEras.includes(chronoEra(i)))}
function chronoChoice(p){
  if(!p.length)return null;
  const c=p[Math.floor(Math.random()*p.length)];
  let candidates=p.filter(i=>i!==c&&i.year!==c.year);
  if(difficulty==="hard")candidates.sort((a,b)=>Math.abs(a.year-c.year)-Math.abs(b.year-c.year));else candidates=shuffle(candidates);
  const years=uniq([c.year,...candidates.map(i=>i.year)]).slice(0,4);
  return years.length===4?{type:"choice",section:"chronology",item:c,stem:c.text,prompt:"上の出来事が起こった年として最も適切なものを選びなさい。",options:shuffle(years)}:null;
}
function chronoBetween(p){
  const s=[...p].sort((a,b)=>a.year-b.year||a.text.localeCompare(b.text));
  if(s.length<4)return null;
  for(let t=0;t<1000;t++){
    const a=Math.floor(Math.random()*(s.length-2));
    const maxB=Math.min(s.length-1,a+5);
    const b=a+1+Math.floor(Math.random()*(maxB-a));
    const low=s[a],high=s[b];
    const mid=s.filter(x=>x.year>low.year&&x.year<high.year);
    if(!mid.length)continue;
    const correct=mid[Math.floor(Math.random()*mid.length)];
    let outside=s.filter(x=>x.year<=low.year||x.year>=high.year).filter(x=>x!==low&&x!==high);
    if(difficulty==="hard")outside.sort((x,y)=>Math.min(Math.abs(x.year-low.year),Math.abs(x.year-high.year))-Math.min(Math.abs(y.year-low.year),Math.abs(y.year-high.year)));
    else outside=shuffle(outside);
    const options=[correct,...outside].filter((x,i,a)=>a.findIndex(y=>y.year===x.year)===i).slice(0,4);
    if(options.length===4)return{type:"between",section:"chronology",prompt:"次の2つの出来事の間に起こった出来事として最も適切なものを選びなさい。",low,high,correctChoice:correct,options:shuffle(options)};
  }
  return null;
}
function pickSort(p,n){
  let a=[],gap=difficulty==="easy"?30:5;
  for(let t=0;t<1500&&a.length<n;t++){
    const c=p[Math.floor(Math.random()*p.length)];
    if(!a.some(x=>x.year===c.year)&&a.every(x=>Math.abs(x.year-c.year)>=gap)) a.push(c);
  }
  if(a.length<n){
    a=[];
    for(const c of shuffle(p)){
      if(!a.some(x=>x.year===c.year)) a.push(c);
      if(a.length===n) break;
    }
  }
  return a.length===n?a:null;
}
function perms(n){let out=[];function r(a,z){if(!z.length){out.push(a.join(","));return}for(let i=0;i<z.length;i++)r([...a,z[i]],[...z.slice(0,i),...z.slice(i+1)])}r([],Array.from({length:n},(_,i)=>i));return out}
const KATAKANA_LABELS=["ア","イ","ウ","エ","オ","カ"];
function chronoSort(p,n){
  const items=pickSort(p,n);if(!items)return null;
  const display=shuffle(items),labs=KATAKANA_LABELS.slice(0,n);
  const ans=display.map((it,i)=>({it,i})).sort((a,b)=>a.it.year-b.it.year||a.it.text.localeCompare(b.it.text)).map(x=>labs[x.i]).join("→");
  const all=perms(n).map(x=>x.split(",").map(i=>labs[+i]).join("→"));
  const wrong=shuffle(all.filter(x=>x!==ans)).slice(0,Math.min(5,all.length-1));
  return {type:"sort",section:"chronology",prompt:"次の出来事を、起こった順（古い順）に並び替えなさい。",displayOrder:display,labels:labs,answer:ans,shown:shuffle([ans,...wrong])};
}function makeChronoQuestion(){let p=chronoPool();if(chronoMode==="choice")return chronoChoice(p);if(chronoMode==="between")return chronoBetween(p);return chronoSort(p,chronoMode==="sort6"?6:4)}
function sig(q){if(!q)return"NULL";return[q.type,q.section,q.prompt||"",q.stem||"",q.answer||"",q.options?.map(x=>typeof x==="object"?x.year+":"+x.text:String(x)).sort().join("|")||"",q.entries?.map(x=>x.label+"="+x.text).join("|")||"",q.displayOrder?.map(x=>x.year).join(",")||""].join("###")}
function validQuestion(q){
  if(!q)return false;
  if(q.type==="choice"){
    if(!Array.isArray(q.options)||q.options.length!==4)return false;
    if(new Set(q.options.map(String)).size!==q.options.length)return false;
    if(q.answer!=null&&!q.options.map(String).includes(String(q.answer)))return false;
    if(q.section==="chronology"&&q.item&&!q.options.map(Number).includes(Number(q.item.year)))return false;
    return true;
  }
  if(q.type==="between")return Array.isArray(q.options)&&q.options.length===4&&new Set(q.options.map(x=>x.year)).size===4&&q.correctChoice&&q.options.some(x=>Number(x.year)===Number(q.correctChoice.year));
  if(q.type==="sort")return Array.isArray(q.shown)&&q.shown.length>=2&&new Set(q.shown).size===q.shown.length;
  return false;
}
function generate(){
  questions=[];const used=new Set();
  for(let i=0;i<SET_SIZE;i++){
    let q=null;
    for(let t=0;t<500;t++){
      const candidate=section==="culture"?makeCultureQuestion():makeChronoQuestion();
      if(validQuestion(candidate)&&!used.has(sig(candidate))){q=candidate;break}
    }
    if(!q)return false;
    used.add(sig(q));questions.push(q);
  }
  return true;
}function startQuiz(){
 section=document.querySelector('input[name="section"]:checked').value;difficulty=document.querySelector('input[name="difficulty"]:checked').value;
 if(section==="culture"){
  cultureMode=document.querySelector('input[name="cultureMode"]:checked').value;
  selectedCultures=culturePool();
  if(selectedCultures.length<2){alert("文化史では2つ以上の文化を選択してください。");return}
  if(["c1","c2","r1","r2","b1","b2"].includes(cultureMode)&&selectedCultures.length<4){alert("このモードは4択で出題するため、4つ以上の文化を選択してください。");return}
  if(cultureMode==="s1"&&selectedCultures.length<4){alert("「文化の特色の並び替え」には、4つ以上の文化を選択してください。");return}
  if((cultureMode==="s2")&&!selectedCultures.some(c=>c.items.length>=4)){alert("「文化のものの並び替え」には、文化のものが4つ以上ある文化を1つ以上選択してください。");return}
  if((cultureMode==="b1"||cultureMode==="b2")&&!selectedCultures.some(c=>CULTURE_SUBRANGES[c.name])){alert("「2つの出来事の間」モードでは、年代範囲が設定された文化を1つ以上選択してください。");return}
}
 else{
  chronoMode=document.querySelector('input[name="chronoMode"]:checked').value;
  selectedChronoEras=[...document.querySelectorAll(".chrono-era:checked")].map(e=>e.value);
  if(!selectedChronoEras.length){alert("年代史では時代を1つ以上選択してください。");return}
  const distinctYears=new Set(chronoPool().map(i=>i.year)).size;
  const need=chronoMode==="sort6"?6:chronoMode==="sort4"?4:chronoMode==="between"?3:2;
  if(distinctYears<need){alert(`選択した範囲では、必要な異なる年号数（${need}個）が足りません。時代を追加してください。`);return}
 }
 if(!generate()){alert("問題を作成できませんでした。選択範囲を広げてください。");return}
 current=0;score=0;$("settings").classList.add("hidden");$("quiz").classList.remove("hidden");renderQuestion()
}
function renderQuestion(){
 questionStartTime=Date.now();
 let q=questions[current],h="";$("progress").textContent=`第${current+1}問 / ${SET_SIZE}　正解 ${score} 問`;if(q.stem)h+=`<div class="stem">${esc(q.stem)}</div>`;h+=`<p>${esc(q.prompt)}</p>`;
 if(q.type==="choice")q.options.forEach((o,i)=>h+=`<button type="button" data-act="choice" data-idx="${i}">${i+1}．${esc(o)}</button>`);
 else if(q.type==="sort"){if(q.entries)q.entries.forEach(e=>h+=`<p><b>${e.label}．</b>${esc(e.text)}</p>`);else q.displayOrder.forEach((e,i)=>h+=`<p><b>${q.labels[i]}．</b>${esc(e.text)}</p>`);q.shown.forEach((o,i)=>h+=`<button type="button" data-act="sort" data-idx="${i}">${i+1}．${esc(o)}</button>`)}
 else{h+=`<p>【前】西暦${q.low.year}年：${esc(q.low.text)}</p><p>【後】西暦${q.high.year}年：${esc(q.high.text)}</p>`;q.options.forEach((o,i)=>h+=`<button type="button" data-act="between" data-idx="${i}">${esc(o.text)}</button>`)}
 $("question").innerHTML=h;$("feedback").innerHTML=""
}
$("question").addEventListener("click",function(e){
 const b=e.target.closest("button[data-act]");if(!b)return;
 const idx=+b.dataset.idx,q=questions[current];
 if(b.dataset.act==="choice")answerChoice(q.options[idx]);
 else if(b.dataset.act==="sort")answerSort(q.shown[idx]);
 else if(b.dataset.act==="between")answerBetween(q.options[idx].year);
});
function goro(i){return i.g?`ごろ合わせ：「${esc(i.g)}」`:"（ごろ合わせなし）"}
function finish(correct,detail){$("question").querySelectorAll("button").forEach(b=>b.disabled=true);$("feedback").innerHTML=`<div class="answer ${correct?"good":"bad"}"><b>${correct?"正解！":"不正解"}</b><br>${detail}</div><button onclick="nextQuestion()">${current===SET_SIZE-1?"結果を見る":"次の問題へ"}</button>`}
function answerChoice(chosen){let q=questions[current],correct=String(chosen)===String(q.section==="culture"?q.answer:q.item.year);if(correct)score++;let d="",correctText,userText=String(chosen);if(q.section==="culture"){
    correctText=q.answer;
    if(q.betweenPair)d+=`<b>2つの出来事：</b>${esc(q.betweenPair.low.name)}（${esc(q.betweenPair.low.yearText)}）→ ${esc(q.betweenPair.high.name)}（${esc(q.betweenPair.high.yearText)}）<br><br>`;
    d+=`<b>正解：</b>${esc(q.answer)}<br><br><b>文化：</b>${esc(q.culture.name)}<br><b>時代：</b>${esc(q.culture.era)}<br><br><b>特色</b><br>${esc(q.culture.trait)}<br><br><b>代表的な文化のもの</b><br>${q.culture.items.map(itemDisplay).map(esc).join("、")}`;
  }else{correctText=q.item.year+"年";userText=chosen+"年";d+=`<b>正解：</b>${q.item.year}年<br>${esc(q.item.text)}<br>${goro(q.item)}<br>年表PDF ${q.item.p} ページ（${esc(q.item.side)}）`}recordAnswer(q,correct,userText,correctText);finish(correct,d)}
function answerSort(chosen){let q=questions[current],correct=chosen===q.answer;if(correct)score++;let d=`<b>正解：</b>${esc(q.answer)}<br>`;if(q.section==="chronology")q.displayOrder.forEach((it,i)=>d+=`${q.labels[i]}．${esc(it.text)}<br>${goro(it)}<br>年表PDF ${it.p} ページ<br>`);else if(q.cultures)q.entries.forEach((e,i)=>d+=`<br>${e.label}．${esc(q.cultures[i].era)}・${esc(q.cultures[i].name)}<br>${esc(e.text)}<br>`);else d+=`<b>文化：</b>${esc(q.culture.name)}（${esc(q.culture.era)}）<br>${esc(q.culture.trait)}`;recordAnswer(q,correct,chosen,q.answer);finish(correct,d)}
function answerBetween(y){let q=questions[current],correct=Number(y)===Number(q.correctChoice.year);if(correct)score++;let chosenOpt=q.options.find(o=>Number(o.year)===Number(y))||q.correctChoice;let d=`<b>正解：</b>${esc(q.correctChoice.text)}（${q.correctChoice.year}年）<br>${q.low.year}年 と ${q.high.year}年 の間に起きました。<br>${goro(q.correctChoice)}<br>年表PDF ${q.correctChoice.p} ページ（${esc(q.correctChoice.side)}）`;recordAnswer(q,correct,`${chosenOpt.text}（${chosenOpt.year}年）`,`${q.correctChoice.text}（${q.correctChoice.year}年）`);finish(correct,d)}
function nextQuestion(){current++;if(current>=SET_SIZE){$("question").innerHTML=`<h2>終了！</h2><p><b>${SET_SIZE}問中 ${score}問正解</b></p>`;$("feedback").innerHTML='<button onclick="backToSettings()">設定に戻る</button>';return}renderQuestion()}
function backToSettings(){$("settings").classList.remove("hidden");$("quiz").classList.add("hidden");$("question").innerHTML="";$("feedback").innerHTML=""}

function openStats(){renderStats();$("settings").classList.add("hidden");$("stats").classList.remove("hidden")}
function closeStats(){$("stats").classList.add("hidden");$("settings").classList.remove("hidden")}
function fmtTime(t){return t==null?"—":t+"秒"}
function renderStats(){
 const total=history.length,correct=history.filter(h=>h.isCorrect).length;
 const avgTime=total?(history.reduce((s,h)=>s+(h.timeSeconds||0),0)/total).toFixed(1):"—";
 const bySection={};
 history.forEach(h=>{const key=h.section==="culture"?"文化史":"年代史";bySection[key]=bySection[key]||{total:0,correct:0,time:0};bySection[key].total++;bySection[key].time+=h.timeSeconds||0;if(h.isCorrect)bySection[key].correct++});
 let sum=`<p><b>総回答数：</b>${total}問　<b>正解数：</b>${correct}問　<b>正答率：</b>${total?(correct/total*100).toFixed(1):0}%　<b>平均解答時間：</b>${avgTime==="—"?"—":avgTime+"秒"}</p>`;
 if(total){
  sum+=`<table><tr><th>分野</th><th>回答数</th><th>正解数</th><th>正答率</th><th>平均時間</th></tr>`;
  for(const k in bySection){const b=bySection[k];sum+=`<tr><td>${esc(k)}</td><td>${b.total}</td><td>${b.correct}</td><td>${(b.correct/b.total*100).toFixed(1)}%</td><td>${(b.time/b.total).toFixed(1)}秒</td></tr>`}
  sum+="</table>";
 }
 $("statsSummary").innerHTML=sum;
 if(!total){$("statsList").innerHTML="<p>まだ記録がありません。クイズに挑戦すると、ここに履歴が表示されます。</p>";return}
 const rows=[...history].reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${h.section==="culture"?"文化史":"年代史"}</td><td>${esc(h.question)}</td><td>${esc(h.userAnswer)}</td><td>${esc(h.correctAnswer)}</td><td class="${h.isCorrect?"ok":"ng"}">${h.isCorrect?"○ 正解":"✕ 不正解"}</td><td>${fmtTime(h.timeSeconds)}</td></tr>`).join("");
 $("statsList").innerHTML=`<table><tr><th>日時</th><th>分野</th><th>問題</th><th>回答</th><th>正解</th><th>結果</th><th>時間</th></tr>${rows}</table>`;
}
function exportHistory(){
 if(!history.length){alert("書き出す記録がありません。");return}
 const blob=new Blob([JSON.stringify(history,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 const ts=nowStamp();
 a.href=url;a.download=`nihonshi_quiz_history_${ts.y}${pad2(ts.m)}${pad2(ts.day)}.json`;
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 URL.revokeObjectURL(url);
}
function importHistory(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=function(ev){
  try{
   const data=JSON.parse(ev.target.result);
   if(!Array.isArray(data))throw new Error("形式が不正です");
   const key=r=>`${r.date}|${r.question}|${r.userAnswer}|${r.timeSeconds}`;
   const seen=new Set(history.map(key));
   let added=0;
   data.forEach(r=>{if(r&&typeof r==="object"&&typeof r.date==="string"&&!seen.has(key(r))){history.push(r);seen.add(key(r));added++}});
   history.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
   saveHistory();renderStats();
   alert(`${added}件の記録を読み込みました。（合計 ${history.length}件）`);
  }catch(err){alert("JSONファイルの読み込みに失敗しました。ファイル形式を確認してください。")}
  e.target.value="";
 };
 reader.readAsText(file);
}
function clearHistory(){
 if(!history.length){alert("記録はまだありません。");return}
 if(!confirm("これまでの学習履歴をすべて削除します。よろしいですか？（この操作は元に戻せません）"))return;
 history=[];saveHistory();renderStats();
}
